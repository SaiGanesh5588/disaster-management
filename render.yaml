services:
  - type: web
    name: disaster-management-backend
    env: node
    buildCommand: |
      cd backend
      npm install
    startCommand: node render-start.js
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: MONGODB_URL
        fromDatabase:
          name: mongodb
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: '*'  # Update this with your frontend URL in production
