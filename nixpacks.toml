[phases.setup]
nixPkgs = ['nodejs-18.x', 'nodePackages.npm']

[phases.install]
cmds = ['cd backend && npm install']

[phases.build]
cmds = ['echo "Building backend..."']

[start]
cmd = 'cd backend && node server.js'

[build.environment]
NODE_ENV = "production"
NPM_CONFIG_PRODUCTION = "false"

[build.args]
RAILWAY_ENVIRONMENT = "production"

[build.install]
run = "cd backend && npm install"

[build.build]
run = "echo 'Build complete'"
