[build]
  command = "npm install && npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "9"
  CI = "false"

# Redirect all requests to index.html for SPA routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Handle SPA routing - return 200 for all paths
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Environment variables for build
[context.production.environment]
  NODE_ENV = "production"
  VITE_API_BASE_URL = "https://disaster-management-backend-production.up.railway.app"

[context.deploy-preview.environment]
  NODE_ENV = "development"
  VITE_API_BASE_URL = "http://localhost:5000"

[dev]
  framework = "vite"
  command = "npm run dev"
  port = 3000
  targetPort = 5173
  publish = "dist"
  autoLaunch = true
